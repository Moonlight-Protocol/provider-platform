name: Deploy to Mainnet

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-mainnet
  cancel-in-progress: true

env:
  APP: moonlight-mainnet-provider

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: mainnet
    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --config fly.mainnet.toml --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Capture Fly app logs on failure
        if: failure()
        run: flyctl logs -a "$APP" --no-tail
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
